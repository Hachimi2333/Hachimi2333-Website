<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The title, description, og:* and canonical tags below are the template
      defaults. `scripts/prerender.ts` overwrites all of them per route when it
      writes dist/, and src/lib/seo.ts overwrites them again after a client-side
      navigation. Changing the #app container or any of these tag shapes means
      updating the patterns in scripts/prerender.ts, which fails the build if
      they stop matching.
    -->
    <title>Hachimi2333</title>
    <meta name="description" content="Hachimi2333 的个人网站 - 博客、工具和更多" />
    <link rel="canonical" href="https://www.hachimi2333.top/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hachimi2333" />
    <meta property="og:title" content="Hachimi2333" />
    <meta property="og:description" content="Hachimi2333 的个人网站 - 博客、工具和更多" />
    <meta property="og:url" content="https://www.hachimi2333.top/" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Runs before the first paint so a dark-mode visitor never sees a light
      // flash. Keep the logic in sync with src/composables/useTheme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          // Storage blocked: fall back to the stylesheet default.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
